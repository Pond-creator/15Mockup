<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%97%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h2>🔗 Hub Login</h2>
    <div class="error-msg" id="errMsg"></div>
    <input type="text" id="username" placeholder="ชื่อผู้ใช้" autocomplete="username">
    <input type="password" id="password" placeholder="รหัสผ่าน" autocomplete="current-password">
    <button id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="hint-msg" id="hintMsg"></div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById('password').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') doLogin();
});

// เวลารอก่อนขึ้นข้อความปลอบใจว่าเซิร์ฟเวอร์ช้า (Google สุ่มช้าได้ถึง 30 วิ)
var SLOW_HINT_MS = 8000;
var loginBusy = false;   // กันกดปุ่ม/กด Enter ซ้ำระหว่างที่ยังรอผลอยู่

// สลับปุ่มเข้า/ออกโหมด "กำลังทำงาน" — ให้เห็นทันทีที่กดว่ากดติดแล้ว ไม่ใช่เงียบหาย
function setLoginBusy(busy) {
  var btn = document.getElementById('loginBtn');
  loginBusy = busy;
  btn.disabled = busy;
  btn.innerHTML = busy
    ? '<span class="btn-spin"></span>กำลังเข้าสู่ระบบ...'
    : 'เข้าสู่ระบบ';
  if (!busy) document.getElementById('hintMsg').textContent = '';
}

function doLogin() {
  if (loginBusy) return;   // กำลังรออยู่ กดซ้ำไม่มีผล
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  var errEl = document.getElementById('errMsg');
  var hintEl = document.getElementById('hintMsg');
  errEl.textContent = '';
  if (!username || !password) {
    errEl.textContent = 'กรอกชื่อผู้ใช้และรหัสผ่านให้ครบ';
    return;
  }
  setLoginBusy(true);
  // ถ้าเกิน 8 วิยังไม่ได้คำตอบ บอกผู้ใช้ว่าไม่ได้ค้าง — ระบบกำลังลองใหม่ให้เอง
  var hintTimer = setTimeout(function () {
    hintEl.textContent = 'เซิร์ฟเวอร์ Google ตอบช้ากว่าปกติ กำลังลองใหม่อัตโนมัติ...';
  }, SLOW_HINT_MS);

  apiPost('login', { username: username, password: password }).then(function (res) {
    clearTimeout(hintTimer);
    if (res.success) {
      setSession({
        username: username, role: res.role, displayName: res.displayName,
        allowedCategories: res.allowedCategories || [],
        allowedLinks: res.allowedLinks || [],
        token: res.token, expiresAt: res.expiresAt
      });
      // ไม่ปลดปุ่ม ปล่อยให้หมุนต่อระหว่างเปลี่ยนหน้าไป hub (กันจอนิ่งเหมือนไม่มีอะไรเกิดขึ้น)
      window.location.href = 'hub.html';
    } else {
      setLoginBusy(false);
      errEl.textContent = res.message || 'เข้าสู่ระบบไม่สำเร็จ';
    }
  }).catch(function () {
    clearTimeout(hintTimer);
    setLoginBusy(false);
    errEl.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (ลองใหม่ให้แล้ว 3 ครั้ง) — กดเข้าสู่ระบบอีกครั้งได้เลย';
  });
}
</script>
</body>
</html>
