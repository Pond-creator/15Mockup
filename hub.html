<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub - รวมงานทั้งหมด</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%97%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <h1>🔗 Hub รวมงานทั้งหมด</h1>
  <div class="user-info">
    <span id="whoami"></span>
    <a href="admin.html" id="adminLink" style="display:none;">จัดการหน้า</a>
    <button onclick="logout()">ออกจากระบบ</button>
  </div>
</div>
<div class="container" id="container">
  <div class="loading-box">
    <div class="spinner"></div>
    <p class="loading-pct" id="loadingPct">0%</p>
    <p class="loading-text">กำลังโหลด...</p>
  </div>
</div>
<script src="js/api.js"></script>
<script>
var session = requireLogin();
if (session) {
  document.getElementById('whoami').textContent = session.displayName + ' (' + session.role + ')';
  if (session.role === 'admin') document.getElementById('adminLink').style.display = 'inline-block';
  loadLinks();
}

var hubCategories = [];   // ชื่อหมวดตามลำดับ (หลังกรองสิทธิ์แล้ว)
var hubByCategory = {};   // หมวด -> อาเรย์ลิงก์

function loadLinks() {
  // มีแคชสด (ไม่เกิน 45 วิ) ของ user คนนี้ไหม — ถ้ามีโชว์ทันทีไม่ต้องรอเลย
  // แล้วค่อยดึงของจริงมาอัปเดตเงียบๆ เบื้องหลังเสมอ (stale-while-revalidate กันเห็นของเก่าค้างนาน)
  var cached = getLinksCache();
  if (cached) {
    applyLinksData(cached, true);
    apiGet('getLinks').then(function (res) {
      if (res.success) {
        setLinksCache(res.data);
        applyLinksData(res.data, false);   // false = อัปเดตผลลัพธ์เฉยๆ ไม่แตะช่องค้นหาที่อาจพิมพ์ค้างอยู่
      }
    }).catch(function () { /* เน็ตหลุดตอนอัปเดตเงียบๆ ไม่เป็นไร ใช้ของแคชต่อไปได้ */ });
    return;
  }

  var pctEl = document.getElementById('loadingPct');
  var progress = pctEl ? startFakeProgress(pctEl) : null;
  apiGet('getLinks').then(function (res) {
    var container = document.getElementById('container');
    if (!res.success) {
      if (progress) progress.stop();
      container.innerHTML = '<div class="empty-msg">โหลดข้อมูลไม่สำเร็จ: ' + (res.message || '') + '</div>';
      return;
    }
    if (progress) progress.finish();
    setLinksCache(res.data);
    applyLinksData(res.data, true);
  }).catch(function () {
    if (progress) progress.stop();
    document.getElementById('container').innerHTML = '<div class="empty-msg">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>';
  });
}

// ประมวลผลลิงก์ดิบ (กรอง active + สิทธิ์ + จัดกลุ่มหมวด) แล้ววาดหน้า
// buildSearchBox=true → สร้างช่องค้นหาใหม่ (โหลดครั้งแรก/จากแคช) · false → แค่วาดผลลัพธ์ทับ ใช้ช่องค้นหาเดิม (อัปเดตเงียบๆ เบื้องหลัง)
function applyLinksData(rawData, buildSearchBox) {
  var container = document.getElementById('container');
  // แสดงเฉพาะลิงก์ที่เปิดใช้งาน (active)
  var links = (rawData || []).filter(function (l) { return l.active !== false; });
  if (!links.length) {
    container.innerHTML = '<div class="empty-msg">ยังไม่มีลิงก์ — ไปที่ "จัดการหน้า" เพื่อเพิ่ม</div>';
    return;
  }
  // จำกัดสิทธิ์ user (admin เห็นทุกอย่างเสมอ)
  // - allowedCategories: เห็นทั้งหมวด (ทุกลิงก์ในหมวดนั้น)
  // - allowedLinks: เห็นเฉพาะลิงก์ที่ระบุ แม้หมวดนั้นจะไม่ได้อยู่ใน allowedCategories ก็ตาม
  // - ทั้งสองว่าง = เห็นทุกอย่าง (ค่าเริ่มต้น ไม่ล็อกใคร)
  var allowedCats = (session && session.allowedCategories) || [];
  var allowedLinkIds = (session && session.allowedLinks) || [];
  var restricted = session && session.role !== 'admin' && (allowedCats.length || allowedLinkIds.length);
  if (restricted) {
    links = links.filter(function (l) {
      return allowedCats.indexOf(l.category) !== -1 || allowedLinkIds.indexOf(l.id) !== -1;
    });
  }
  if (!links.length) {
    container.innerHTML = '<div class="empty-msg">ยังไม่มีเมนูที่คุณเข้าถึงได้ — ติดต่อผู้ดูแลระบบ</div>';
    return;
  }
  hubByCategory = {};
  links.forEach(function (l) {
    if (!hubByCategory[l.category]) hubByCategory[l.category] = [];
    hubByCategory[l.category].push(l);
  });
  hubCategories = Object.keys(hubByCategory).sort(function (a, b) {
    var oa = hubByCategory[a][0].categoryOrder || 0;
    var ob = hubByCategory[b][0].categoryOrder || 0;
    if (oa !== ob) return oa - ob;
    return a.localeCompare(b);
  });

  var existingBox = document.getElementById('searchBox');
  if (!buildSearchBox && existingBox) {
    renderHub(existingBox.value);   // วาดผลลัพธ์ใหม่ทับ คงคำค้นหา/โฟกัสเดิมไว้
    return;
  }

  // โครงหน้า: ช่องค้นหา + พื้นที่แสดงหมวด
  container.innerHTML =
    '<div class="search-wrap">' +
      '<span class="search-icon">🔍</span>' +
      '<input type="text" id="searchBox" class="search-box" placeholder="ค้นหาลิงก์ / หมวด...">' +
      '<span class="search-clear" id="searchClear" title="ล้าง">✕</span>' +
    '</div>' +
    '<div id="hubCats"></div>';
  var box = document.getElementById('searchBox');
  box.addEventListener('input', function () { renderHub(this.value); });
  document.getElementById('searchClear').addEventListener('click', function () {
    box.value = ''; renderHub(''); box.focus();
  });
  renderHub('');
}

function renderHub(query) {
  var q = (query || '').trim().toLowerCase();
  var host = document.getElementById('hubCats');
  var clearBtn = document.getElementById('searchClear');
  if (clearBtn) clearBtn.style.display = q ? 'flex' : 'none';
  var html = '<div class="hub-categories">';
  var totalShown = 0;
  hubCategories.forEach(function (cat) {
    var items = hubByCategory[cat].slice().sort(function (a, b) { return (a.linkOrder || 0) - (b.linkOrder || 0); });
    if (q) {
      var catMatch = cat.toLowerCase().indexOf(q) !== -1;
      items = items.filter(function (l) {
        return catMatch ||
          (l.name || '').toLowerCase().indexOf(q) !== -1 ||
          (l.description || '').toLowerCase().indexOf(q) !== -1;
      });
    }
    if (!items.length) return;   // ซ่อนหมวดที่ไม่มีลิงก์ตรงคำค้น
    totalShown += items.length;
    html += '<div class="category-block">';
    html += '<div class="category-title">' + escapeHtml(cat) + '</div>';
    html += '<div class="link-list">';
    items.forEach(function (l) {
      var icon = l.icon ? l.icon : '🔗';
      html += '<a class="link-card" href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">';
      html += '<span class="link-icon">' + escapeHtml(icon);
      if (l.requiresLogin) html += '<span class="login-badge" title="ต้อง login ก่อนเข้าใช้งาน">🔑</span>';
      html += '</span>';
      html += '<span class="link-text">';
      html += '<span class="link-name">' + escapeHtml(l.name) + '</span>';
      if (l.description) html += '<span class="link-desc">' + escapeHtml(l.description) + '</span>';
      html += '</span></a>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  if (!totalShown) {
    html = '<div class="empty-msg">ไม่พบลิงก์ที่ตรงกับ "' + escapeHtml(query) + '"</div>';
  }
  host.innerHTML = html;
}

function escapeHtml(s) {
  var div = document.createElement('div');
  div.textContent = s == null ? '' : s;
  return div.innerHTML;
}
</script>
</body>
</html>
